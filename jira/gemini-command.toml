# Gemini CLI custom command -> /jira
# Thin wrapper that injects the shared SKILL.md so Claude and Gemini use the
# same source of truth. Generated into ~/.gemini/commands/jira.toml by install.sh
# (which substitutes __SKILL_MD__ with this machine's absolute SKILL.md path).
description = "Work with Jira: describe, create, update, comment, or transition issues"

prompt = """
You are helping the user work with Jira from the current conversation —
describing, creating, updating, commenting on, or transitioning issues. Use the
connected local Jira MCP if available; otherwise fall back to the Jira REST API
with configured credentials (JIRA_URL / JIRA_USERNAME / JIRA_API_TOKEN). Only
write a markdown file if the user explicitly asks for one. Follow these
instructions exactly:

@{__SKILL_MD__}

---
Request / issue key / context (may be empty — derive from conversation if so): {{args}}
"""
