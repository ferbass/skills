# Gemini CLI custom command -> /handoff
# Thin wrapper that injects the shared SKILL.md so Claude and Gemini use the
# same source of truth. Generated into ~/.gemini/commands/handoff.toml by
# install.sh (which substitutes __SKILL_MD__ with the absolute SKILL.md path).
description = "Capture ongoing work into a handoff doc, or resume from one"

prompt = """
You are helping the user hand off in-flight work to another agent/session, or
resume from an existing handoff. Pick the mode (create vs resume) from the
phrasing and the args below, then follow these instructions exactly:

@{__SKILL_MD__}

---
Mode hint / slug / handoff to resume (may be empty — infer from conversation if so): {{args}}
"""
