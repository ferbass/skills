# Gemini CLI custom command -> /write-post
# Thin wrapper that injects the shared SKILL.md so Claude and Gemini use the
# same source of truth. Generated into ~/.gemini/commands/write-post.toml by
# install.sh (which substitutes __SKILL_MD__ with the absolute SKILL.md path).
description = "Write a blog post for the user's personal Jekyll blog"

prompt = """
You are helping the user write a post for their personal blog. Follow these
instructions exactly:

@{__SKILL_MD__}

---
The topic / request for this post: {{args}}

If that is empty or missing key context, ask the clarifying questions first.
"""
